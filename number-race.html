<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#dbeafe">
<title>Number Run — 10×10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --text:#1e293b; --muted:#64748b; --line:#e2e8f0;
  --primary:#6366f1; --primary-d:#4338ca;
  --card:#ffffff;
  --shadow:0 4px 14px rgba(30,41,59,.10);
  --gap:6px;
  --pad:8px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}

html, body{
  margin:0;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  overscroll-behavior:none;
  touch-action:manipulation;
}

body{
  font-family:'Fredoka','Baloo 2',Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--text);
  background:linear-gradient(135deg,#dbeafe 0%,#fef3c7 48%,#fce7f3 100%);
  background-attachment:fixed;
}

button,input,select{font:inherit;font-family:inherit}

/* =====================================================
   FLOATING BACKGROUND ICONS
   ===================================================== */
.bg-decor{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:0;
}
.bg-decor span{
  position:absolute;
  font-size:clamp(28px,6vw,52px);
  opacity:.32;
  animation:floaty 12s ease-in-out infinite;
  filter:drop-shadow(0 3px 6px rgba(30,41,59,.10));
  will-change:transform;
}
@keyframes floaty{
  0%,100%{transform:translateY(0) rotate(-8deg)}
  50%    {transform:translateY(-22px) rotate(9deg)}
}
.bg-decor span:nth-child(2n){animation-duration:15s}
.bg-decor span:nth-child(3n){animation-duration:18s}

/* =====================================================
   APP SHELL
   ===================================================== */
.app{
  position:relative;
  z-index:1;
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  gap:var(--gap);
  padding:var(--pad);
  padding-top:max(var(--pad), env(safe-area-inset-top));
  padding-bottom:max(var(--pad), env(safe-area-inset-bottom));
  width:100%;
  max-width:640px;
  margin:0 auto;
  overflow:hidden;
}

/* ---------- header ---------- */
header{
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:0 2px;
}
h1{
  margin:0;
  font-size:clamp(17px, 5vw, 24px);
  font-weight:700;
  letter-spacing:.3px;
  background:linear-gradient(90deg,#f59e0b,#ef4444,#8b5cf6,#3b82f6,#22c55e);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  line-height:1.1;
}
.sound-btn{
  flex:none;
  width:36px;height:36px;
  border-radius:50%;
  border:2px solid #fff;
  background:#fff;
  font-size:17px;
  cursor:pointer;
  box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;
  padding:0;
  transition:transform .12s;
}
.sound-btn:active{transform:scale(.9)}

/* =====================================================
   PANEL
   ===================================================== */
.panel{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:var(--gap);
  overflow:hidden;
}
.hidden{display:none !important}

/* =====================================================
   SETUP
   ===================================================== */
.mode-row{
  flex:none;
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:var(--gap);
}
.mode{
  border:2px solid var(--line);
  background:#fff;
  border-radius:14px;
  padding:9px 4px;
  text-align:center;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:1px;
  transition:.15s;
  box-shadow:var(--shadow);
  min-width:0;
  overflow:hidden;
}
.mode .icon{font-size:22px;line-height:1}
.mode strong{font-size:12px;font-weight:600;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mode small{font-size:9px;color:var(--muted);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mode:active{transform:scale(.97)}
.mode.active{
  border-color:var(--primary);
  background:#eef2ff;
  box-shadow:0 4px 12px rgba(99,102,241,.28);
}

.opts-row{
  flex:none;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:var(--gap);
}
.opt{
  display:flex;
  align-items:center;
  gap:6px;
  background:#fff;
  border:2px solid var(--line);
  border-radius:14px;
  padding:4px 8px 4px 10px;
  box-shadow:var(--shadow);
  min-width:0;
  position:relative;
}
.opt::after{
  content:"▾";
  position:absolute;
  right:9px;
  top:50%;
  transform:translateY(-50%);
  font-size:11px;
  color:#94a3b8;
  pointer-events:none;
}
.opt .lbl{font-size:16px;flex:none}
.opt select{
  flex:1;
  min-width:0;
  border:none;
  background:transparent;
  font-size:14px;
  font-weight:600;
  color:var(--text);
  padding:8px 22px 8px 2px;
  outline:none;
  cursor:pointer;
  -webkit-appearance:none;
  appearance:none;
  text-align:right;
  text-align-last:right;
  direction:rtl;
}
.opt select option{direction:ltr;text-align:left;}

.players{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:var(--gap);
  align-content:start;
  overflow:hidden;
}
.player-input{
  display:flex;
  align-items:center;
  gap:6px;
  background:#fff;
  border:2px solid var(--line);
  border-radius:14px;
  padding:3px 8px 3px 3px;
  box-shadow:var(--shadow);
  min-width:0;
}
.avatar-btn{
  flex:none;
  width:40px;height:40px;
  border-radius:50%;
  border:2px solid #fff;
  font-size:22px;
  cursor:pointer;
  padding:0;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(30,41,59,.15);
  position:relative;
  transition:transform .12s;
}
.avatar-btn:active{transform:scale(.92)}
.avatar-btn::after{
  content:"✎";
  position:absolute;bottom:-2px;right:-2px;
  width:15px;height:15px;
  background:#6366f1;color:#fff;
  border-radius:50%;font-size:8px;
  display:flex;align-items:center;justify-content:center;
  border:1.5px solid #fff;
}
.player-input input{
  flex:1;
  min-width:0;
  border:none;
  background:transparent;
  padding:9px 4px;
  font-size:14px;
  font-weight:500;
  outline:none;
}
.player-input input::placeholder{color:#94a3b8}

.tap-hint{
  flex:none;
  text-align:center;
  font-size:11px;
  color:var(--muted);
  margin:-2px 0 0;
}

/* ---------- buttons ---------- */
.primary{
  border:0;
  border-radius:14px;
  padding:12px 16px;
  font-weight:600;
  font-size:15px;
  cursor:pointer;
  color:#fff;
  background:linear-gradient(135deg,#6366f1,#a855f7);
  box-shadow:0 3px 0 #4338ca, 0 6px 14px rgba(99,102,241,.3);
  transition:transform .1s, box-shadow .1s;
  flex:none;
}
.primary:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 #4338ca}
.primary:disabled{opacity:.45;cursor:not-allowed;box-shadow:0 3px 0 #94a3b8}

.secondary{
  border:0;
  border-radius:10px;
  padding:8px 12px;
  font-weight:600;
  font-size:12px;
  cursor:pointer;
  color:#3730a3;
  background:#eef2ff;
  box-shadow:0 2px 0 #c7d2fe;
}
.secondary:active{transform:translateY(2px);box-shadow:none}

#startBtn{
  flex:none;
  width:100%;
  padding:14px;
  font-size:16px;
}

/* =====================================================
   GAME GRID
   ===================================================== */
.game-grid{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:var(--gap);
}
.game-side{ display:contents; }

.status-bar{ order:1; }
.chips     { order:2; }
.board-area{ order:3; }
.move-text { order:4; }
.controls-bar{ order:5; }

.status-bar{
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  background:#fff;
  border-radius:14px;
  padding:8px 12px;
  box-shadow:var(--shadow);
  min-height:0;
}
#turnText{
  font-weight:600;
  font-size:15px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  min-width:0;
  flex:1;
}
#modeName{
  flex:none;
  font-size:11px;
  color:var(--muted);
  font-weight:600;
  padding:3px 8px;
  background:#f1f5f9;
  border-radius:999px;
}

.chips{
  flex:none;
  display:flex;
  gap:4px;
  flex-wrap:wrap;
  justify-content:center;
  min-height:0;
}
.chip{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 8px;
  border-radius:999px;
  background:#fff;
  font-size:11px;
  font-weight:600;
  box-shadow:var(--shadow);
  border:2px solid transparent;
  transition:.15s;
  max-width:100%;
  overflow:hidden;
}
.chip.active{border-color:var(--primary);background:#eef2ff;}
.chip .av{font-size:14px}
.chip .nm{max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chip .pos{color:var(--primary);font-weight:700;}
.chip .wins{
  background:linear-gradient(135deg,#fde68a,#fbbf24);
  color:#78350f;padding:0 5px;border-radius:999px;font-size:10px;
}

.board-area{
  flex:1;
  min-height:0;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  padding:2px;
}

.board{
  display:grid;
  grid-template-columns:repeat(10, 1fr);
  grid-template-rows:repeat(10, 1fr);
  gap:1px;
  background:#cbd5e1;
  border:2px solid #94a3b8;
  border-radius:10px;
  overflow:hidden;
  container-type:inline-size;
  box-shadow:0 4px 14px rgba(30,41,59,.12);
}
.cell{
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  min-width:0;
  min-height:0;
  font-weight:700;
  color:#334155;
  font-size:clamp(10px, 4cqw, 40px);
  line-height:1;
}
.cell .num{
  position:relative;
  z-index:1;
  line-height:1;
  text-shadow:0 1px 0 rgba(255,255,255,.65);
}
.cell.alt{background:#eaf2ff}
.cell.special{background:linear-gradient(135deg,#fef3c7,#fcd34d) !important;}
.star-bg{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:2em;
  line-height:1;
  color:rgba(255,255,255,.82);
  z-index:0;
  pointer-events:none;
  user-select:none;
}

.tokens{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:3;
  pointer-events:none;
  padding:1px;
}
.token{
  width:clamp(13px, 4.4cqw, 40px);
  height:clamp(13px, 4.4cqw, 40px);
  border-radius:50%;
  border:2px solid #fff;
  box-shadow:0 1px 3px rgba(0,0,0,.35);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(9px, 2.6cqw, 24px);
  line-height:1;
  transition:transform .15s;
}
.token + .token{ margin-left:-38%; }
.token.stepping{animation:hop .2s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{
  0%  {transform:scale(.5) translateY(-4px) rotate(-12deg)}
  60% {transform:scale(1.3) translateY(0) rotate(6deg)}
  100%{transform:scale(1) translateY(0) rotate(0)}
}
.token.moving{
  box-shadow:0 0 0 2px rgba(255,255,255,.95), 0 0 12px rgba(99,102,241,.95);
  z-index:5;
}
.token.landed{animation:land .3s cubic-bezier(.2,1.7,.4,1)}
@keyframes land{
  0%  {transform:scale(.6)}
  55% {transform:scale(1.35)}
  100%{transform:scale(1)}
}

.move-text{
  flex:none;
  text-align:center;
  font-size:12px;
  color:var(--muted);
  min-height:16px;
  line-height:1.2;
  padding:0 6px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.controls-bar{
  flex:none;
  display:flex;
  align-items:center;
  gap:8px;
  background:#fff;
  border-radius:16px;
  padding:7px 9px;
  box-shadow:var(--shadow);
}
.dice-pair{flex:none;display:flex;gap:6px;}

.die{
  width:56px;
  height:56px;
  border:2px solid #e2e8f0;
  border-radius:13px;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  flex:none;
  box-shadow:0 3px 8px rgba(30,41,59,.10);
  position:relative;
}
.die.rolling{animation:shake .16s infinite}
@keyframes shake{
  0%  {transform:rotate(-8deg) translateY(0)}
  50% {transform:rotate(8deg) translateY(-3px)}
  100%{transform:rotate(-8deg) translateY(0)}
}
.pips{display:grid;gap:1.5px}
.pips.grid3{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:34px;height:34px}
.pips.grid10{grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);width:44px;height:17px;gap:1px}
.pip{border-radius:50%;background:#475569;width:100%;height:100%}
.pip.empty{background:#e2e8f0}
.die-num{font-size:12px;font-weight:700;color:#6366f1;line-height:1}

.direction-die{font-size:30px;font-weight:700;line-height:1;}
.direction-die.plus{
  color:#16a34a;border-color:#86efac;
  background:linear-gradient(135deg,#f0fdf4,#dcfce7);
}
.direction-die.minus{
  color:#dc2626;border-color:#fca5a5;
  background:linear-gradient(135deg,#fef2f2,#fee2e2);
}

.controls-bar .roll{
  flex:1;min-width:0;padding:15px 10px;font-size:16px;white-space:nowrap;
}
.controls-bar .new-btn{
  flex:none;width:46px;height:46px;padding:0;font-size:18px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;
}

/* =====================================================
   AVATAR PICKER
   ===================================================== */
.avatar-picker{
  position:fixed;inset:0;
  background:rgba(30,41,59,.55);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  display:flex;align-items:center;justify-content:center;
  padding:16px;z-index:60;
}
.avatar-card{
  background:#fff;border-radius:22px;padding:18px;
  width:min(420px,100%);
  max-height:calc(100dvh - 32px);
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
  text-align:center;
  animation:popIn .3s cubic-bezier(.2,1.5,.4,1);
  display:flex;flex-direction:column;
}
.avatar-card h3{margin:0 0 2px;font-size:17px}
.avatar-card p{margin:0;color:var(--muted);font-size:12px}
.avatar-grid{
  display:grid;grid-template-columns:repeat(5,1fr);gap:7px;
  margin:14px 0;overflow-y:auto;flex:1;min-height:0;
}
.avatar-opt{
  font-size:26px;aspect-ratio:1/1;border-radius:14px;border:2px solid #e2e8f0;
  background:#f8fafc;cursor:pointer;display:flex;align-items:center;justify-content:center;
  padding:0;transition:transform .12s, border-color .12s, background .12s;
}
.avatar-opt:active:not(.taken){transform:scale(.92)}
.avatar-opt.selected{
  border-color:#6366f1;background:#eef2ff;box-shadow:0 0 0 3px rgba(99,102,241,.25);
}
.avatar-opt.taken{opacity:.25;cursor:not-allowed}

/* =====================================================
   OVERLAYS
   ===================================================== */
.overlay{
  position:fixed;inset:0;
  background:rgba(30,41,59,.65);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  display:flex;align-items:center;justify-content:center;
  padding:16px;z-index:50;
}
#confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
.confetti-piece{position:absolute;top:-12%;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(118vh) rotate(560deg);opacity:.85}}

.winner{
  position:relative;background:#fff;border-radius:24px;padding:22px 20px;
  text-align:center;width:min(400px,100%);
  max-height:calc(100dvh - 32px);overflow-y:auto;
  box-shadow:0 22px 60px rgba(0,0,0,.35);
  animation:popIn .4s cubic-bezier(.2,1.5,.4,1);
}
@keyframes popIn{
  0%{transform:scale(.7) translateY(20px);opacity:0}
  100%{transform:scale(1) translateY(0);opacity:1}
}
.winner .trophy{
  font-size:58px;line-height:1;animation:bounce 1.1s ease-in-out infinite;
}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.winner h2{
  font-size:clamp(20px,5.5vw,28px);margin:8px 0 4px;
  background:linear-gradient(90deg,#f59e0b,#ef4444,#8b5cf6);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.winner p{color:var(--muted);margin:4px 0 12px;font-size:13px;line-height:1.4}
.standings{
  background:#f8fafc;border-radius:14px;padding:10px 12px;
  margin-bottom:14px;text-align:left;
}
.standings-title{
  font-weight:700;font-size:12px;color:var(--muted);
  margin-bottom:6px;text-align:center;
}
.standing{display:flex;justify-content:space-between;padding:5px 8px;border-radius:9px;font-size:13px;}
.standing.champ{background:linear-gradient(135deg,#fef3c7,#fde68a);font-weight:700;}
.standing strong{color:#b45309}
.winner-actions{display:flex;flex-direction:column;gap:8px}
.winner-actions .secondary{padding:12px 16px;font-size:14px}

/* ---- rule popup ---- */
#ruleOverlay{z-index:55;}
.rule-card{
  background:#fff;border-radius:24px;padding:24px 22px;
  width:min(370px,100%);
  text-align:center;
  box-shadow:0 22px 60px rgba(0,0,0,.35);
  animation:popIn .35s cubic-bezier(.2,1.5,.4,1);
}
.rule-icon{font-size:54px;line-height:1;animation:bounce 1.2s ease-in-out infinite}
.rule-card h3{
  margin:10px 0 8px;font-size:20px;color:#dc2626;
}
.rule-card p{
  margin:0 0 18px;font-size:14px;color:var(--muted);line-height:1.55;
}
.rule-card p strong{color:var(--text)}
.rule-card .next-up{
  display:inline-block;
  margin:0 0 16px;
  padding:6px 14px;
  background:#eef2ff;
  color:#3730a3;
  border-radius:999px;
  font-size:13px;
  font-weight:600;
}
.rule-card .primary{width:100%;}

/* =====================================================
   SMALL SCREEN TWEAKS
   ===================================================== */
@media (max-height: 560px){
  .die{width:48px;height:48px}
  .pips.grid3{width:28px;height:28px}
  .pips.grid10{width:38px;height:15px}
  .die-num{font-size:10px}
  .direction-die{font-size:24px}
  .controls-bar .roll{padding:12px 8px;font-size:14px}
  .mode{padding:6px 3px}
  .mode .icon{font-size:18px}
  .mode strong{font-size:11px}
  .mode small{display:none}
}

@media (max-width: 340px){
  .chip .nm{max-width:42px}
  .mode strong{font-size:11px}
  .player-input input{font-size:12px}
  .opt select{font-size:13px}
}

/* =====================================================
   LARGE SCREEN
   ===================================================== */
@media (min-width: 900px){
  .app{
    max-width:1180px;
    padding:14px;
    gap:10px;
  }
  header{padding:0 4px}

  #setup{
    max-width:700px;
    width:100%;
    margin:0 auto;
  }

  .game-grid{
    display:grid;
    grid-template-columns:minmax(300px, 380px) 1fr;
    grid-template-rows:minmax(0, 1fr);
    gap:16px;
    align-items:stretch;
  }
  .game-side{
    display:flex;
    flex-direction:column;
    gap:10px;
    min-height:0;
    grid-column:1;
    grid-row:1;
    overflow:hidden;
  }
  .board-area{
    grid-column:2;
    grid-row:1;
    order:0;
    padding:0;
  }

  .game-side .status-bar  { order:1; }
  .game-side .chips       { order:2; }
  .game-side .controls-bar{ order:3; }
  .game-side .move-text   { order:4; }

  .game-side .status-bar{padding:12px 16px}
  #turnText{font-size:18px}
  #modeName{font-size:12px;padding:4px 10px}

  .chip{font-size:13px;padding:5px 12px}

<body>

  <span style="left:88%; top:6%;  animation-delay:-4s">⭐</span>

  <span style="left:8%;  top:82%; animation-delay:-9s">🌈</span>
  <span style="left:86%; top:80%; animation-delay:-5s">🍭</span>
  <span style="left:46%; top:2%;  animation-delay:-3s">✨</span>
  <span style="left:50%; top:94%; animation-delay:-6s">🎉</span>

<script>
/* =========================================================
   CONSTANTS & STATE
   ========================================================= */
const COLORS  = ["#ef4444","#3b82f6","#22c55e","#a855f7","#f59e0b","#06b6d4"];
const CHEERS  = ["Amazing!","Fantastic!","Brilliant!","Superb!","Wonderful!","Incredible!","You did it!"];

const AVATAR_CHOICES = [
  "🐯","🐼","🐸","🦊","🐵","🐧","🦁","🐨","🐷","🐮",
  "🐰","🐻","🐙","🦄","🐝","🦋","🐢","🐳","🦉","🐲",
  "🐬","🦖","🐿️","🦒","🐘"
];

const PIP_SETS = {
  1: [4],
  2: [0, 8],
  3: [0, 4, 8],
  4: [0, 2, 6, 8],
  5: [0, 2, 4, 6, 8],
  6: [0, 2, 3, 5, 6, 8]
};

const STEP_MS = 190;

let mode = "add";
let players = [];
let turn = 0;
let busy = false;
let diceSides = 6;
let soundOn = true;
let chosenAvatars = [];
let pickerIndex = -1;
let movingPlayerIndex = -1;
let steppingPlayerIndex = -1;

/* Timer used to auto-dismiss the "move blocked" popup */
let ruleTimer = null;

const $ = id => document.getElementById(id);

/* =========================================================
   SOUND ENGINE
   ========================================================= */
let audioCtx = null;

function ac(){
  if(!audioCtx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return null;
    audioCtx = new Ctx();
  }
  if(audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

function tone(freq, dur = .12, type = "sine", vol = .14, delay = 0){
  if(!soundOn) return;
  const ctx = ac();
  if(!ctx) return;
  try{
    const t    = ctx.currentTime + delay;
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol, t + .02);
    gain.gain.exponentialRampToValueAtTime(.0001, t + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + dur + .05);
  }catch(e){ /* ignore */ }
}

const playTick  = () => tone(560 + Math.random() * 340, .05, "square", .05);
const playClick = () => tone(520, .09, "triangle", .12);
const playPick  = () => { tone(660, .09, "triangle", .14); tone(990, .12, "sine", .12, .07); };
const playStep  = () => { tone(520, .05, "sine", .10); tone(720, .06, "sine", .08, .04); };
const playLand  = () => { tone(760, .1, "triangle", .16); tone(1140, .14, "sine", .12, .07); };

const playBlocked = () => {
  tone(240, .16, "sawtooth", .11);
  tone(170, .26, "sawtooth", .10, .15);
};

function playWin(){
  const notes = [523, 659, 784, 1047, 1319, 1568];
  notes.forEach((f, i) => tone(f, .34, "triangle", .17, i * .12));
  tone(2093, .7, "sine", .11, .78);
}

function speakCongrats(name){
  if(!soundOn || !("speechSynthesis" in window)) return;
  try{
    window.speechSynthesis.cancel();
    const msg = `Congratulations ${name}! You won the Number Run! Great job!`;
    const u = new SpeechSynthesisUtterance(msg);
    u.rate = 0.95; u.pitch = 1.25; u.volume = 1;
    window.speechSynthesis.speak(u);
  }catch(e){ /* ignore */ }
}

/* =========================================================
   BOARD SIZING
   ========================================================= */
function fitBoard(){
  const area  = $("boardArea");
  const board = $("board");
  if(!area || !board) return;
  if(area.clientWidth < 2 || area.clientHeight < 2) return;
  const size = Math.floor(Math.min(area.clientWidth, area.clientHeight));
  board.style.width  = size + "px";
  board.style.height = size + "px";
}

window.addEventListener("resize", () => requestAnimationFrame(fitBoard));
window.addEventListener("orientationchange", () => setTimeout(fitBoard, 200));

if(window.ResizeObserver){
  try{
    const ro = new ResizeObserver(() => fitBoard());
    ro.observe($("boardArea"));
  }catch(e){ /* ignore */ }
}

/* =========================================================
   AVATAR HELPERS
   ========================================================= */
function nextFreeAvatar(list){
  for(const a of AVATAR_CHOICES){
    if(!list.includes(a)) return a;
  }
  return AVATAR_CHOICES[Math.floor(Math.random() * AVATAR_CHOICES.length)];
}

function openAvatarPicker(i){
  pickerIndex = i;
  $("pickerFor").textContent = `Player ${i + 1}`;

  const grid = $("avatarGrid");
  grid.innerHTML = "";

  AVATAR_CHOICES.forEach(a => {
    const owner = chosenAvatars.indexOf(a);
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "avatar-opt";
    btn.textContent = a;

    if(owner === i)        btn.classList.add("selected");
    else if(owner !== -1)  btn.classList.add("taken");

    btn.addEventListener("click", () => {
      if(owner !== -1 && owner !== i) return;
      chosenAvatars[i] = a;
      playPick();
      closeAvatarPicker();
      setupInputs();
    });

    grid.appendChild(btn);
  });

  $("avatarPicker").classList.remove("hidden");
}

function closeAvatarPicker(){
  $("avatarPicker").classList.add("hidden");
  pickerIndex = -1;
}

/* =========================================================
   SETUP SCREEN
   ========================================================= */
function setupInputs(){
  const n = +$("playerCount").value;
  const oldNames = [...$("playersInputs").querySelectorAll("input")].map(i => i.value);

  if(chosenAvatars.length > n) chosenAvatars.length = n;
  while(chosenAvatars.length < n){
    chosenAvatars.push(nextFreeAvatar(chosenAvatars));
  }

  $("playersInputs").innerHTML = "";

  for(let i = 0; i < n; i++){
    const d = document.createElement("div");
    d.className = "player-input";

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "avatar-btn";
    btn.textContent = chosenAvatars[i];
    btn.style.background = COLORS[i] + "22";
    btn.style.borderColor = COLORS[i];
    btn.setAttribute("aria-label", `Change avatar for Player ${i + 1}`);
    btn.addEventListener("click", () => { playClick(); openAvatarPicker(i); });

    const input = document.createElement("input");
    input.placeholder = `Player ${i + 1}`;
    input.maxLength = 14;
    input.value = oldNames[i] || "";

    d.appendChild(btn);
    d.appendChild(input);
    $("playersInputs").appendChild(d);
  }
}

document.querySelectorAll(".mode").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".mode").forEach(x => x.classList.remove("active"));
    btn.classList.add("active");
    mode = btn.dataset.mode;
    playClick();
  });
});

$("playerCount").addEventListener("change", () => { playClick(); setupInputs(); });
$("avatarClose").addEventListener("click", () => { playClick(); closeAvatarPicker(); });
$("avatarPicker").addEventListener("click", e => {
  if(e.target === $("avatarPicker")) closeAvatarPicker();
});

$("soundBtn").addEventListener("click", () => {
  soundOn = !soundOn;
  $("soundBtn").textContent = soundOn ? "🔊" : "🔇";
  if(!soundOn && "speechSynthesis" in window) window.speechSynthesis.cancel();
  if(soundOn) playClick();
});

setupInputs();

/* =========================================================
   DICE DISPLAY
   ========================================================= */
function showDie(value){
  const pipsEl = $("dicePips");
  const numEl  = $("diceNum");
  pipsEl.innerHTML = "";

  if(value >= 1 && value <= 6){
    pipsEl.className = "pips grid3";
    const filled = new Set(PIP_SETS[value]);
    for(let i = 0; i < 9; i++){
      const p = document.createElement("span");
      p.className = "pip" + (filled.has(i) ? "" : " empty");
      pipsEl.appendChild(p);
    }
  }else if(value >= 7 && value <= 10){
    pipsEl.className = "pips grid10";
    for(let i = 0; i < 10; i++){
      const p = document.createElement("span");
      p.className = "pip" + (i < value ? "" : " empty");
      pipsEl.appendChild(p);
    }
  }else{
    pipsEl.className = "pips grid3";
    for(let i = 0; i < 9; i++){
      const p = document.createElement("span");
      p.className = "pip empty";
      pipsEl.appendChild(p);
    }
  }

  numEl.textContent = (value >= 1 && value <= 10) ? value : "?";
}

function setDirectionDie(dir){
  const el = $("directionDie");
  if(dir === 1){
    el.textContent = "＋";
    el.classList.add("plus");  el.classList.remove("minus");
  }else if(dir === -1){
    el.textContent = "−";
    el.classList.add("minus"); el.classList.remove("plus");
  }else{
    el.textContent = "？";
    el.classList.remove("plus","minus");
  }
}

function defaultSignForMode(){
  if(mode === "add")      return  1;
  if(mode === "subtract") return -1;
  return 0;
}

/* =========================================================
   DIRECTION LOGIC
   ========================================================= */
function pickDirection(){
  if(mode === "add")      return  1;
  if(mode === "subtract") return -1;
  return Math.random() < 0.5 ? 1 : -1;
}

/* 🚦 Would this move overshoot the finish? */
function isMoveAllowed(pos, dir, d){
  const target = pos + dir * d;
  return target >= 0 && target <= 100;
}

/* =========================================================
   GAME START / RESET
   ========================================================= */
function startPos(){
  return mode === "add" ? 0 : mode === "subtract" ? 100 : 50;
}

function startGame(){
  diceSides = +$("diceSides").value;

  players = [...$("playersInputs").querySelectorAll("input")].map((x, i) => ({
    name  : x.value.trim() || `Player ${i + 1}`,
    label : `P${i + 1}`,
    avatar: chosenAvatars[i] || AVATAR_CHOICES[i] || "🐯",
    color : COLORS[i],
    pos   : startPos(),
    wins  : 0
  }));

  $("setup").classList.add("hidden");
  $("game").classList.remove("hidden");

  $("modeName").textContent = mode === "add" ? "➕ Add Run"
                            : mode === "subtract" ? "➖ Subtract Run"
                            : "🔄 Add & Subtract";

  resetRound();

  requestAnimationFrame(() => {
    fitBoard();
    requestAnimationFrame(fitBoard);
  });
}

function resetRound(){
  if("speechSynthesis" in window) window.speechSynthesis.cancel();
  if(ruleTimer){ clearTimeout(ruleTimer); ruleTimer = null; }

  players.forEach(p => p.pos = startPos());
  turn = 0;
  busy = false;
  movingPlayerIndex  = -1;
  steppingPlayerIndex = -1;

  $("ruleOverlay").classList.add("hidden");
  $("rollBtn").disabled = false;
  $("rollBtn").textContent = "🎲 ROLL";
  $("numberDie").classList.remove("rolling");
  showDie(0);
  setDirectionDie(defaultSignForMode());

  $("moveText").textContent = "Tap ROLL to move!";
  render();
  requestAnimationFrame(fitBoard);
}

/* =========================================================
   RENDER
   ========================================================= */
function render(){
  const board = $("board");
  board.innerHTML = "";

  const cells = [];
  for(let row = 9; row >= 0; row--){
    const start = row * 10 + 1;
    for(let col = 0; col < 10; col++) cells.push(start + col);
  }

  cells.forEach(num => {
    const c = document.createElement("div");
    c.className = "cell";

    const r   = Math.floor((num - 1) / 10);
    const col = (num - 1) % 10;

    if(num === 1 || num === 50 || num === 100){
      c.classList.add("special");
      c.innerHTML =
        `<span class="star-bg" aria-hidden="true">★</span>
         <span class="num">${num}</span>
         <div class="tokens"></div>`;
    }else{
      if((r + col) % 2 !== 0) c.classList.add("alt");
      c.innerHTML = `<span class="num">${num}</span><div class="tokens"></div>`;
    }

    players.forEach((p, i) => {
      if(p.pos === num){
        const t = document.createElement("span");
        t.className = "token";
        t.style.background = p.color;
        t.textContent = p.avatar;
        t.title = `${p.name} (${p.pos})`;

        if(i === movingPlayerIndex)  t.classList.add("moving");
        if(i === steppingPlayerIndex) t.classList.add("stepping");

        c.querySelector(".tokens").appendChild(t);
      }
    });

    board.appendChild(c);
  });

  const cur = players[turn];
  if(cur) $("turnText").textContent = `${cur.avatar} ${cur.name}'s turn`;

  $("scoreChips").innerHTML = players.map((p, i) => `
    <div class="chip ${i === turn ? "active" : ""}">
      <span class="av">${p.avatar}</span>
      <span class="nm">${escapeHtml(p.name)}</span>
      <span class="pos">${p.pos}</span>
      ${p.wins ? `<span class="wins">🏆${p.wins}</span>` : ""}
    </div>`).join("");
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]
  ));
}

/* =========================================================
   ROLLING
   ========================================================= */
function roll(){
  if(busy || !players.length) return;
  busy = true;
  $("rollBtn").disabled = true;

  const finalD   = 1 + Math.floor(Math.random() * diceSides);
  const finalDir = pickDirection();

  let count = 0;
  const total = 9;
  $("numberDie").classList.add("rolling");

  const timer = setInterval(() => {
    showDie(1 + Math.floor(Math.random() * diceSides));
    if(mode === "both") setDirectionDie(Math.random() < .5 ? 1 : -1);
    playTick();
    count++;

    if(count >= total){
      clearInterval(timer);
      $("numberDie").classList.remove("rolling");
      showDie(finalD);
      setDirectionDie(finalDir);
      setTimeout(() => resolveRoll(finalDir, finalD), 240);
    }
  }, 80);
}

/* Decide: walk the token, or block the move */
function resolveRoll(dir, d){
  const p = players[turn];

  if(!isMoveAllowed(p.pos, dir, d)){
    handleBlockedMove(p, dir, d);
    return;
  }
  animateMove(dir, d);
}

/* =========================================================
   🚫 BLOCKED MOVE
   ---------------------------------------------------------
   Turn advances IMMEDIATELY (state is updated right away).
   The popup is purely informational — closing it only
   re-enables the ROLL button. This guarantees the game
   can never get stuck on the same player.
   ========================================================= */
function handleBlockedMove(p, dir, d){
  const target = p.pos + dir * d;
  const limit  = target > 100 ? 100 : 0;
  const over   = Math.abs(target - limit);

  /* --- snapshot the player who was blocked (for the message) --- */
  const blockedAvatar = p.avatar;
  const blockedName   = escapeHtml(p.name);
  const blockedPos    = p.pos;

  /* --- build the popup text --- */
  $("ruleTitle").textContent = "🚫 Move not allowed!";
  $("ruleMsg").innerHTML =
    `${blockedAvatar} <strong>${blockedName}</strong> rolled ` +
    `<strong>${dir === 1 ? "＋" : "−"}${d}</strong> from <strong>${blockedPos}</strong>, ` +
    `which would land on <strong>${target}</strong> — ${over} past the finish at ` +
    `<strong>${limit}</strong>.<br><br>` +
    `The counter stays put and the turn passes on.`;

  /* --- ✅ ADVANCE THE TURN RIGHT NOW --- */
  turn = (turn + 1) % players.length;
  movingPlayerIndex   = -1;
  steppingPlayerIndex = -1;

  const nextP = players[turn];
  $("ruleNext").textContent = `👉 Next up: ${nextP.avatar} ${nextP.name}`;
  $("moveText").textContent = `Move blocked — ${nextP.name}'s turn!`;

  /* Keep ROLL locked until the popup is dismissed */
  busy = true;
  $("rollBtn").disabled = true;

  render();
  $("ruleOverlay").classList.remove("hidden");
  playBlocked();

  /* Auto-dismiss after a few seconds so nobody gets stuck */
  if(ruleTimer) clearTimeout(ruleTimer);
  ruleTimer = setTimeout(closeRulePopup, 4500);
}

/* Popup dismiss — just unlocks the ROLL button */
function closeRulePopup(){
  if($("ruleOverlay").classList.contains("hidden")) return;

  if(ruleTimer){ clearTimeout(ruleTimer); ruleTimer = null; }
  $("ruleOverlay").classList.add("hidden");
  playClick();

  /* Turn was already advanced — only unlock controls now */
  busy = false;
  $("rollBtn").disabled = false;
  render();
}

$("ruleOk").addEventListener("click", closeRulePopup);
$("ruleOverlay").addEventListener("click", e => {
  if(e.target === $("ruleOverlay")) closeRulePopup();
});

/* =========================================================
   STEP-BY-STEP MOVEMENT
   ========================================================= */
function animateMove(dir, d){
  const pIdx  = turn;
  const p     = players[pIdx];
  const start = p.pos;

  movingPlayerIndex   = pIdx;
  steppingPlayerIndex = pIdx;

  $("moveText").textContent =
    `${p.avatar} ${p.name} hopping ${dir === 1 ? "＋" : "−"}${d}...`;

  let stepped = 0;

  setTimeout(function hop(){
    const current = p.pos;
    const next    = current + dir;

    if(next < 0 || next > 100){
      finishMove(pIdx, start, dir, d);
      return;
    }

    p.pos = next;
    stepped++;

    movingPlayerIndex   = pIdx;
    steppingPlayerIndex = pIdx;

    playStep();
    render();

    if(stepped >= d || p.pos === 100 || p.pos === 0){
      setTimeout(() => finishMove(pIdx, start, dir, d), STEP_MS);
      return;
    }

    setTimeout(hop, STEP_MS);
  }, 110);
}

function finishMove(pIdx, start, dir, d){
  const p = players[pIdx];

  movingPlayerIndex   = pIdx;
  steppingPlayerIndex = -1;
  render();
  playLand();

  $("moveText").textContent =
    `${p.avatar} ${p.name}: ${dir === 1 ? "＋" : "−"}${d} (${start} → ${p.pos})`;

  if(isWin(p)){
    busy = true;
    movingPlayerIndex = -1;
    setTimeout(() => showWinner(p), 420);
    return;
  }

  turn = (turn + 1) % players.length;
  busy = false;
  movingPlayerIndex = -1;

  $("rollBtn").disabled = false;
  render();
}

function isWin(p){
  if(mode === "add")      return p.pos === 100;
  if(mode === "subtract") return p.pos === 0;
  return p.pos === 100 || p.pos === 0;
}

/* =========================================================
   WINNER
   ========================================================= */
function showWinner(p){
  p.wins++;
  movingPlayerIndex = -1;
  render();

  const cheer = CHEERS[Math.floor(Math.random() * CHEERS.length)];

  $("winnerName").textContent = `${p.avatar} ${p.name} Wins!`;
  $("winnerMessage").textContent =
    `${cheer} ${p.name} reached ${p.pos} and finished the run! 🎊`;

  const sorted = [...players].sort((a, b) => b.wins - a.wins);
  $("winnerStandings").innerHTML =
    `<div class="standings-title">🏆 Wins so far</div>` +
    sorted.map(q => `
      <div class="standing ${q === p ? "champ" : ""}">
        <span>${q.avatar} ${escapeHtml(q.name)}</span>
        <strong>${q.wins}</strong>
      </div>`).join("");

  $("winnerOverlay").classList.remove("hidden");
  launchConfetti();
  playWin();
  setTimeout(() => speakCongrats(p.name), 900);
}

function launchConfetti(){
  const layer = $("confetti");
  layer.innerHTML = "";
  const emojis = ["🎉","⭐","🎈","🏆","✨","🎊","💫","🌟"];

  for(let i = 0; i < 36; i++){
    const s = document.createElement("span");
    s.className = "confetti-piece";
    s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    s.style.left = Math.random() * 100 + "%";
    s.style.fontSize = (13 + Math.random() * 20) + "px";
    s.style.animationDelay = (Math.random() * 1.3) + "s";
    s.style.animationDuration = (2.2 + Math.random() * 1.8) + "s";
    layer.appendChild(s);
  }
  setTimeout(() => { layer.innerHTML = ""; }, 5200);
}

/* =========================================================
   BUTTON WIRING
   ========================================================= */
$("startBtn").addEventListener("click", startGame);
$("rollBtn").addEventListener("click", roll);

$("newBtn").addEventListener("click", () => {
  playClick();
  if("speechSynthesis" in window) window.speechSynthesis.cancel();
  if(ruleTimer){ clearTimeout(ruleTimer); ruleTimer = null; }
  $("game").classList.add("hidden");
  $("setup").classList.remove("hidden");
  $("winnerOverlay").classList.add("hidden");
  $("ruleOverlay").classList.add("hidden");
  setupInputs();
});

$("playAgain").addEventListener("click", () => {
  playClick();
  if("speechSynthesis" in window) window.speechSynthesis.cancel();
  $("winnerOverlay").classList.add("hidden");
  resetRound();
});

$("backToSetup").addEventListener("click", () => {
  playClick();
  if("speechSynthesis" in window) window.speechSynthesis.cancel();
  $("winnerOverlay").classList.add("hidden");
  $("game").classList.add("hidden");
  $("setup").classList.remove("hidden");
  setupInputs();
});

document.addEventListener("keydown", e => {
  if(e.code === "Space" || e.code === "Enter"){
    const ruleOpen = !$("ruleOverlay").classList.contains("hidden");
    if(ruleOpen){
      e.preventDefault();
      closeRulePopup();
      return;
    }
    if(!$("game").classList.contains("hidden") &&
       $("winnerOverlay").classList.contains("hidden") &&
       !$("rollBtn").disabled){
      e.preventDefault();
      roll();
    }
  }
});

window.addEventListener("load", () => requestAnimationFrame(fitBoard));
</script>
</body>
